<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Guias de Party Quests para o Dream MS.">
<title>Oracle Dream · Party Quest Guides</title>
<style>
:root{color-scheme:light;--ink:#242c27;--muted:#4f6055;--forest:#183d32;--line:#dce7db;--paper:#fcfdf9;--accent:#a43f20}
*{box-sizing:border-box}
body{margin:0;background:#eff5ec;color:var(--ink);font:1rem/1.6 system-ui,sans-serif}
a{color:inherit}
a:focus-visible,summary:focus-visible{outline:3px solid #bc681e;outline-offset:4px}
.shell{display:grid;grid-template-columns:17rem minmax(0,1fr);min-height:100vh}
aside{background:var(--forest);color:white;padding:2rem 1.4rem}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.28rem;text-decoration:none}
.logo{background:#fce5a8;border-radius:.65rem;padding:.26rem .52rem;color:#873727}
nav{margin-top:2.8rem}
nav h2{font-size:.94rem;color:#c0dac9;margin:0 0 .8rem}
nav a{display:block;background:#315a47;border:1px solid #688775;border-radius:.55rem;padding:.65rem .85rem;text-decoration:none;font-weight:700}
nav a:hover{background:#416e55}
main{width:min(100%,68rem);margin-inline:auto;padding:clamp(1rem,4vw,3rem)}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:clamp(1.45rem,5vw,3.8rem);min-height:17rem;border:1px solid #adcdba;border-radius:1.3rem;background:linear-gradient(165deg,#deefef 5%,#eaf2cd 85%);display:flex;align-items:center}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;background:#a8c791;width:75%;height:64%;right:-14%;bottom:-38%;transform:rotate(-14deg)}
.hero::after{background:#82ad7e;right:18%;bottom:-50%;transform:rotate(15deg)}
.sun{position:absolute;z-index:-1;right:12%;top:13%;width:clamp(3rem,10vw,7rem);aspect-ratio:1;border-radius:50%;background:#f9dc91}
.hero p{margin:.5rem 0 0;color:#344d3e}
h1,h2{line-height:1.15}
h1{font:700 clamp(2.5rem,6vw,4.6rem)/1.05 Georgia,serif;margin:.45rem 0}
.label{font-size:.88rem;font-weight:800;letter-spacing:.05em;color:var(--accent)}
.guide{margin-top:1.5rem;padding:clamp(1.2rem,4vw,2rem);background:var(--paper);border:1px solid var(--line);border-radius:1rem;scroll-margin:1rem}
.guide:target{border-color:#698f68}
.guide h2{margin:.35rem 0 .75rem;font:700 2rem Georgia,serif}
.guide p{color:var(--muted);margin:.5rem 0}
footer{padding:1.3rem 0;color:var(--muted);font-size:.9rem}
@media(max-width:680px){.shell{grid-template-columns:1fr}aside{padding:1rem}nav{margin-top:1rem}.hero{min-height:13rem}}
</style>
</head>
<body>
<div class="shell">
<aside>
<a class="brand" href="./"><span class="logo" aria-hidden="true">🍁</span> Oracle Dream</a>
<nav aria-labelledby="guides-nav">
<h2 id="guides-nav">Party Quest Guides</h2>
<a href="#genesis">Gênesis</a>
</nav>
</aside>
<main>
<header class="hero">
<span class="sun" aria-hidden="true"></span>
<div>
<span class="label">MapleStory · Dream MS</span>
<h1>Party Quest Guides</h1>
<p>Guias em português para jogar em grupo no Dream MS.</p>
</div>
</header>
<section class="guide" id="genesis" aria-labelledby="genesis-title">
<span class="label">Em preparação</span>
<h2 id="genesis-title">Gênesis</h2>
<p>Os requisitos, as etapas e os prints da missão serão publicados aqui.</p>
</section>
<footer>Oracle Dream · Projeto da comunidade</footer>
</main>
</div>
</body>
</html>
